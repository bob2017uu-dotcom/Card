<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作家工作室的扶手椅和桌子</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
            color: black;
        }
        .item-burgundy {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.5;
            color: #800000;
            text-align: justify;  /* выравнивание по ширине */
        }
        .item-burgundy::before {
            content: none;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 霍察·纳姆萨拉耶夫（1889–1959）工作室的扶手椅与桌子</div>
        <div class="item-burgundy">霍察·纳姆萨拉耶夫 — 诗人、散文家、剧作家、社会活动家，布里亚特-蒙古苏维埃社会主义自治共和国作家协会会员（1934），苏联作家协会布里亚特-蒙古代表（1934）。霍察·纳姆萨拉耶夫是布里亚特文学的奠基人之一，为布里亚特文学中史诗体裁的形成做出了重要贡献。</div>
    </div>

    <div class="item">
        <div class="item-title">2. 扶手椅。曾属于纳姆日勒·巴尔达诺（1907–1984）</div>
        <div class="item-burgundy">剧作家，布里亚特自治共和国人民作家，布里亚特自治共和国人民演员，俄罗斯苏维埃联邦社会主义共和国功勋艺术活动家，苏联作家协会会员。巴尔达诺是布里亚特英雄史诗《格斯尔》的校订版本及诗歌改编本的作者。</div>
    </div>

</div>
</body>
</html>
