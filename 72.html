<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ордена, медали и монеты 1–8</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
        .item-desc + .item-desc {
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 圣安娜勋章星章</div>
        <div class="item-desc">19世纪末 — 20世纪初。俄罗斯</div>
        <div class="item-desc">银、珐琅；锻造、上釉</div>
    </div>

    <div class="item">
        <div class="item-title">2. 四等圣乔治勋章</div>
        <div class="item-desc">银、波纹绸带；冲压</div>
    </div>

    <div class="item">
        <div class="item-title">3. 四级“勇氣”奖章</div>
        <div class="item-desc">20世纪初。俄罗斯</div>
        <div class="item-desc">银；冲压</div>
    </div>

    <div class="item">
        <div class="item-title">4. “纪念日俄战争1904–1905年”奖章</div>
        <div class="item-desc">铜；冲压</div>
    </div>

    <div class="item">
        <div class="item-title">5. 1883年一卢布硬币</div>
        <div class="item-desc">银；铸造</div>
    </div>

    <div class="item">
        <div class="item-title">6. 1883年三戈比硬币</div>
        <div class="item-desc">铜；铸造</div>
    </div>

    <div class="item">
        <div class="item-title">7. 1897年一卢布硬币</div>
        <div class="item-desc">银；铸造</div>
    </div>

    <div class="item">
        <div class="item-title">8. 1896年五十戈比硬币</div>
        <div class="item-desc">银；铸造</div>
    </div>

</div>
</body>
</html>
