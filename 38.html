<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буддийские предметы 7–12</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">7. 家用佛龛（内置阎魔敌、扎姆萨兰与玛哈嘎拉护法唐卡）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木，打底画布；雕刻，着色，矿物颜料</div>
    </div>

    <div class="item">
        <div class="item-title">8. 白老人（世间万物之主）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木；雕刻，矿物颜料</div>
    </div>

    <div class="item">
        <div class="item-title">9. 家用佛龛（内置贡高尔财神唐卡）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木，矿物颜料</div>
    </div>

    <div class="item">
        <div class="item-title">10. 家用佛龛（内置阎魔浮雕）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木，粘土；雕刻，着色，压印</div>
    </div>

    <div class="item">
        <div class="item-title">11. 家用佛龛（内置财神浮雕）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木，粘土；雕刻，着色，压印</div>
    </div>

    <div class="item">
        <div class="item-title">12. 模型。阿察扎仓（建于1743年）</div>
        <div class="item-desc">19世纪，布里亚特</div>
        <div class="item-desc">木；雕刻，彩绘</div>
    </div>

</div>
</body>
</html>
