<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предметы из бересты и кожи</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item">
        <div class="item-title">1. 驮包</div>
        <div class="item-desc">桦树皮、海豹毛皮、鹿皮革、布料、玻璃珠</div>
    </div>
    <div class="item">
        <div class="item-title">2. 桦树皮女红盒</div>
        <div class="item-desc">桦树皮、桦木薄木片、皮革</div>
    </div>
    <div class="item">
        <div class="item-title">3. 桦皮篓</div>
        <div class="item-desc">桦树皮、木材</div>
    </div>
</div>
</body>
</html>
