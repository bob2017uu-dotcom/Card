<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспонаты 1–3 (революционное знамя, седло, сигнальный рожок)</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-plain {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-plain::before {
            content: none;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">

    <!-- 1 -->
    <div class="item">
        <div class="item-title">1. 荣誉革命红旗（复制品）</div>
        <div class="item-plain">1929年中东铁路事件中，布里亚特-蒙古骑兵师因作战英勇获授此旗。</div>
    </div>

    <!-- 2 -->
    <div class="item">
        <div class="item-title">2. 马鞍</div>
        <div class="item-desc">1920年代，布里亚特-蒙古苏维埃社会主义自治共和国</div>
    </div>

    <!-- 3 -->
    <div class="item">
        <div class="item-title">3. 信号号角</div>
        <div class="item-desc">20世纪初</div>
        <div class="item-desc">金属合金</div>
    </div>

</div>
</body>
</html>
