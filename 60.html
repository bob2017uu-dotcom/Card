<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спортивная шапка и перчатки (Сочи 2014)</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-plain {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-plain::before {
            content: none;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item-title">运动帽与手套 — 2014年索契冬季奥运会</div>
    <div class="item-plain">曾属于齐贝科夫•铁木尔，2009年至2017年任布里亚特共和国文化部长</div>
</div>
</body>
</html>
