<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библия 1816</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
        /* Чтобы между двумя пунктами не было большого отступа */
        .item-desc + .item-desc {
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item">
        <div class="item-title">圣经</div>
        <div class="item-desc">1816，莫斯科：主教公会印刷厂</div>
        <div class="item-desc">纸，纸板，皮革；活字印刷</div>
    </div>
</div>
</body>
</html>
