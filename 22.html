<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чайный набор (Корея)</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item-title">双人茶具 (韩国代表团赠)</div>
    <div class="item-desc">2014年，韩国「MOMKID 手绘工艺」</div>
    <div class="item-desc">精陶，贴花，印花</div>
</div>
</body>
</html>
