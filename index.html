<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка экспоната</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 600px;
            background: white;
            color: black;
            padding: 30px;
            border: none;
        }
        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid black;
        }
        ul {
            list-style-type: disc;  /* круглые точки */
            padding-left: 20px;
            margin: 0;
        }
        li {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>男式加厚外袍 — 宗古尔部</h1>
    <ul>
        <li>19 世纪末 — 20 世纪初。外贝加尔地区</li>
        <li>花纹丝绸、装饰织带、金属配件。机缝与手缝结合</li>
    </ul>
</div>
</body>
</html>
