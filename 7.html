<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Этикетки 4 предметов</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
        .item-desc + .item-desc {
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 腰带及绑腿 —— 用于拴系鞋子</div>
        <div class="item-desc">20世纪初，外贝加尔州</div>
        <div class="item-desc">毛绒线，毛纱；机织</div>
    </div>

    <div class="item">
        <div class="item-title">2. 织带梳（小型织筘）—— 用于编织窄腰带和绑腿的工具</div>
        <div class="item-desc">20世纪初</div>
        <div class="item-desc">木</div>
    </div>

    <div class="item">
        <div class="item-title">3. 雕花盒</div>
        <div class="item-desc">1930年代</div>
        <div class="item-desc">木，颜料；三面凹刻；涂漆</div>
    </div>

    <div class="item">
        <div class="item-title">4. 洗衣棒</div>
        <div class="item-desc">20世纪初</div>
        <div class="item-desc">木，油彩</div>
    </div>

</div>
</body>
</html>
