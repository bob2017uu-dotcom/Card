<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кожаные изделия</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item">
        <div class="item-title">1. 兽皮袋</div>
        <div class="item-desc">海豹皮，鹿皮，麂皮</div>
    </div>
    <div class="item">
        <div class="item-title">2. 夏季鞋</div>
        <div class="item-desc">软麂皮，棉布，鹿颈下毛，珠子</div>
    </div>
    <div class="item">
        <div class="item-title">3. 冬季鞋</div>
        <div class="item-desc">鹿皮，软麂皮，玻璃珠</div>
    </div>
    <div class="item">
        <div class="item-title">4. 垫子</div>
        <div class="item-desc">海豹皮</div>
    </div>
    <div class="item">
        <div class="item-title">5. 手套</div>
        <div class="item-desc">软麂皮，熏制驼鹿皮，布料，珠子</div>
    </div>
    <div class="item">
        <div class="item-title">6. 烟袋包</div>
        <div class="item-desc">麂皮，软麂皮，布料，珠子</div>
    </div>
    <div class="item">
        <div class="item-title">7. 垫子</div>
        <div class="item-desc">鹿皮，鹿颈下毛，棉布</div>
    </div>
</div>
</body>
</html>
