<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Животноводство и обработка шерсти</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .section-title {
            font-size: 26px;
            font-weight: normal;
            text-align: center;
            margin: 20px 0 30px 0;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="section-title">畜牧业，毛与鬃毛加工</div>

    <div class="item">
        <div class="item-title">1. 《织毯女》</div>
        <div class="item-desc">1992年</div>
        <div class="item-desc">木；雕刻</div>
    </div>

    <div class="item">
        <div class="item-title">2. 骟马器具</div>
        <div class="item-desc">骨，木，金属</div>
    </div>

    <div class="item">
        <div class="item-title">3. 刮马板</div>
        <div class="item-desc">金属，木，皮革</div>
    </div>

    <div class="item">
        <div class="item-title">4. 马绊</div>
        <div class="item-desc">马鬃毛，木，皮革</div>
    </div>

    <div class="item">
        <div class="item-title">5. 牛犊绊</div>
        <div class="item-desc">皮革，木</div>
    </div>

    <div class="item">
        <div class="item-title">6. 编织缰绳</div>
        <div class="item-desc">马鬃毛；编织</div>
    </div>

    <div class="item">
        <div class="item-title">7. 剪羊毛剪刀</div>
        <div class="item-desc">金属合金</div>
    </div>
</div>
</body>
</html>
