<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буддийские предметы 1–6</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 阿弥陀佛（无量光佛）</div>
        <div class="item-desc">19世纪末—20世纪初。布里亚特</div>
        <div class="item-desc">铜合金，颜料；錾刻，镀金</div>
    </div>

    <div class="item">
        <div class="item-title">2. 文殊菩萨（般若智慧与教法之菩萨）</div>
        <div class="item-desc">19世纪。多伦诺尔，内蒙古</div>
        <div class="item-desc">铜合金，颜料；錾刻，镀金</div>
    </div>

    <div class="item">
        <div class="item-title">3. 白度母（救度母，慈悲与怜悯之女神）</div>
        <div class="item-desc">19世纪。多伦诺尔，内蒙古</div>
        <div class="item-desc">铜合金，颜料；錾刻，镀金</div>
    </div>

    <div class="item">
        <div class="item-title">4. 家用佛龛（内置宗喀巴与释迦牟尼佛像）</div>
        <div class="item-desc">19世纪。布里亚特</div>
        <div class="item-desc">木，铜；雕刻，着色，錾刻，镀金</div>
    </div>

    <div class="item">
        <div class="item-title">5. 家用佛龛（内置宗喀巴浮雕）</div>
        <div class="item-desc">19世纪。布里亚特</div>
        <div class="item-desc">木，铜；雕刻，着色，錾刻</div>
    </div>

    <div class="item">
        <div class="item-title">6. 佛塔。内附释迦牟尼佛唐卡</div>
        <div class="item-desc">20世纪初。布里亚特</div>
        <div class="item-desc">铜合金，颜料；錾刻，镀金</div>
    </div>

</div>
</body>
</html>
