<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузнечное ремесло</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        /* Заголовок раздела: по центру, не жирный, без черты */
        .section-title {
            font-size: 26px;
            font-weight: normal;
            text-align: center;
            margin: 20px 0 30px 0;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="section-title">锻造工艺</div>

    <div class="item">
        <div class="item-title">1. 饮器</div>
        <div class="item-desc">铜，锡；铸造，錾刻</div>
    </div>

    <div class="item">
        <div class="item-title">2. 铁砧</div>
        <div class="item-desc">铁，木</div>
    </div>

    <div class="item">
        <div class="item-title">3. 虎钳</div>
        <div class="item-desc">铁</div>
    </div>

    <div class="item">
        <div class="item-title">4. 锤子</div>
        <div class="item-desc">铁</div>
    </div>
</div>
</body>
</html>
