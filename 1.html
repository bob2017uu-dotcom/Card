<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспонаты</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        /* Каждый блок экспоната */
        .item {
            margin-bottom: 28px;
        }
        /* Заголовок: номер + название, под ним полоска */
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        /* Описание (материалы) с точкой */
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        /* Точка перед текстом */
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item">
        <div class="item-title">1. 子弹带</div>
        <div class="item-desc">海豹毛皮、鹿毛皮、麂皮、布料、鹿颈下毛</div>
    </div>
    <div class="item">
        <div class="item-title">2. 仿鹿哨 (用于吸引马鹿)</div>
        <div class="item-desc">生皮、兽筋、线</div>
    </div>
    <div class="item">
        <div class="item-title">3. 刮刀</div>
        <div class="item-desc">木、铁</div>
    </div>
    <div class="item">
        <div class="item-title">4. 钻</div>
        <div class="item-desc">金属、木、皮</div>
    </div>
    <div class="item">
        <div class="item-title">5. 宽刃刀 (用于猎杀大型野兽及加工木材)</div>
        <div class="item-desc">铁；锻打</div>
    </div>
    <div class="item">
        <div class="item-title">6. 矛</div>
        <div class="item-desc">铁</div>
    </div>
    <div class="item">
        <div class="item-title">7. 弩箭镞</div>
        <div class="item-desc">铁</div>
    </div>
    <div class="item">
        <div class="item-title">8. 鱼叉 (用于叉捕大鱼)</div>
        <div class="item-desc">铁</div>
    </div>
    <div class="item">
        <div class="item-title">9. 刻刀 (用于加工木材和骨头)</div>
        <div class="item-desc">铁、骨</div>
    </div>
</div>
</body>
</html>
