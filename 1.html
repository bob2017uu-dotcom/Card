<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музейная этикетка</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
            border: none;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid black;   /* чёрная полоска под названием */
        }
        ul {
            list-style: none;
            padding-left: 0;
            margin: 16px 0 0 0;
        }
        li {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 12px;
            padding-left: 0;
        }
        /* Точка перед текстом */
        li::before {
            content: "• ";   /* точка с пробелом */
            font-size: 18px;
            display: inline;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>子弹带</h1>   <!-- Замените на название вашего экспоната -->
    <ul>
        <li>海豹毛皮、鹿毛皮、麂皮、布料、鹿颈下毛</li>
        <!-- Если нужно два пункта, добавьте ещё один <li> -->
    </ul>
</div>
</body>
</html>
