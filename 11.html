<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коллекция: холодное оружие и утварь</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
        .item-desc + .item-desc {
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 佩剑</div>
        <div class="item-desc">17–18世纪，西欧</div>
        <div class="item-desc">钢，金属；铸造，锻造</div>
    </div>

    <div class="item">
        <div class="item-title">2. 直刃重剑</div>
        <div class="item-desc">18世纪初，德国</div>
        <div class="item-desc">钢，铜，木；铸造，锻造，雕刻</div>
    </div>

    <div class="item">
        <div class="item-title">3. 直刃重剑</div>
        <div class="item-desc">18世纪初，俄罗斯</div>
        <div class="item-desc">钢，木；铸造，锻造</div>
    </div>

    <div class="item">
        <div class="item-title">4. 装饰性搅乳器（带霍里布里亚特使团觐见彼得大帝主题纹样）</div>
        <div class="item-desc">1985年，乌兰乌德市</div>
        <div class="item-desc">雪松木，雕刻</div>
    </div>

</div>
</body>
</html>
