<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эвенкийская одежда и утварь</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">

    <!-- 1. Эвенкийское платье и головная повязка -->
    <div class="item">
        <div class="item-title">1. 鄂温克族女子连衣裙，头带</div>
        <div class="item-desc">布里亚特苏维埃社会主义自治共和国</div>
        <div class="item-desc">缎子，珠子</div>
    </div>

    <!-- Летняя обувь (без номера) -->
    <div class="item">
        <div class="item-title">夏季鞋</div>
        <div class="item-desc">呢子，棉布，珠子</div>
    </div>

    <!-- 2. Колыбель для новорождённого мальчика с амулетом -->
    <div class="item">
        <div class="item-title">2. 带有护身符的新生男婴摇篮</div>
        <div class="item-desc">桦木，皮革，布料，桦树皮，狍蹄、下颌骨及骨骼，珠子</div>
    </div>

    <!-- 3. Сумка для рукодельных принадлежностей -->
    <div class="item">
        <div class="item-title">3. 手工艺用品收纳包</div>
        <div class="item-desc">桦树皮，海豹皮与鹿皮，麂皮，布料，玻璃珠</div>
    </div>

    <!-- 4. Подстилка -->
    <div class="item">
        <div class="item-title">4. 垫子</div>
        <div class="item-desc">公野鸭带羽毛皮</div>
    </div>

</div>
</body>
</html>
