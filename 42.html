<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспонаты 1–6 (исторические)</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">1. 《西伯利亚绘图志》第16页的复制图</div>
        <div class="item-desc">纸，墨</div>
    </div>

    <div class="item">
        <div class="item-title">2. 钥匙</div>
        <div class="item-desc">18–19世纪</div>
        <div class="item-desc">铁；铸造</div>
    </div>

    <div class="item">
        <div class="item-title">3. 直刃重剑</div>
        <div class="item-desc">17–18世纪</div>
        <div class="item-desc">金属合金，木，布料，皮革；锻造</div>
    </div>

    <div class="item">
        <div class="item-title">4. 城防火绳枪枪管（城堡前装枪）</div>
        <div class="item-desc">17世纪</div>
        <div class="item-desc">金属合金</div>
    </div>

    <div class="item">
        <div class="item-title">5. 18世纪型炮台炮模型</div>
        <div class="item-desc">铜，金属合金，木</div>
    </div>

    <div class="item">
        <div class="item-title">6. 俄罗斯拓荒者锁子甲</div>
        <div class="item-desc">18世纪。贝加尔湖沿岸地区</div>
        <div class="item-desc">铁；锻造，弯曲</div>
    </div>

</div>
</body>
</html>
