<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспонаты 9–12</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
        .item-desc + .item-desc {
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="item">
        <div class="item-title">9. 提炉</div>
        <div class="item-desc">20世纪初。俄罗斯</div>
        <div class="item-desc">黄铜，水钻，镂空，焊接</div>
    </div>

    <div class="item">
        <div class="item-title">10. 圣谢尔盖•拉多涅日斯基、耶稣基督及圣母圣像钟</div>
        <div class="item-desc">21世纪初，莫斯科</div>
        <div class="item-desc">金属合金，铸造</div>
    </div>

    <div class="item">
        <div class="item-title">11. 纪念品“圣英诺肯提（韦尼亚米诺夫）——诞辰220周年•封圣40周年”</div>
        <div class="item-desc">2017年，伊尔库茨克州</div>
        <div class="item-desc">陶瓷，绳，制陶，烧制</div>
    </div>

    <div class="item">
        <div class="item-title">12. 洗手壶</div>
        <div class="item-desc">20世纪初，布里亚特-蒙古苏维埃社会主义自治共和国</div>
        <div class="item-desc">黄铜，锻造，焊接，铸造</div>
    </div>

</div>
</body>
</html>
