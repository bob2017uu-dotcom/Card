<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ружьё и седло</title>
    <style>
        body {
            background: white;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 800px;
            background: white;
            color: black;
            padding: 20px;
        }
        .item {
            margin-bottom: 28px;
        }
        .item-title {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid black;
        }
        .item-desc {
            margin: 10px 0 0 0;
            font-size: 18px;
            line-height: 1.4;
        }
        .item-desc::before {
            content: "• ";
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="item">
        <div class="item-title">1. 燧发支架步枪</div>
        <div class="item-desc">19世纪末</div>
        <div class="item-desc">钢、木、皮、马鬃</div>
    </div>
    <div class="item">
        <div class="item-title">2. 骑乘马鞍</div>
        <div class="item-desc">20世纪20年代，布里亚特-蒙古苏维埃社会主义自治共和国</div>
    </div>
</div>
</body>
</html>
